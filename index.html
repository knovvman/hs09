    t.addEventListener("input",()=>{
      drafts[id]=t.value;
      autosize(t);
      clearTimeout(commentTimers[id]);
      commentTimers[id]=setTimeout(()=>saveComment(id),700);
    });
    t.addEventListener("blur",()=>{if(id in drafts){clearTimeout(commentTimers[id]);saveComment(id)}});
    body.append(t);
  }
  {
    // phone: a small arrow at the very end of an open card; the whole strip folds the card
    const f=document.createElement("button");f.type="button";f.className="fold";
    f.setAttribute("aria-label","Свернуть заказ #"+id);
    f.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg>';
    // fold in place: the card shrinks from the bottom up and the orders below ride up with it
    f.addEventListener("click",e=>{e.stopPropagation();if(f.dataset.busy)return;f.dataset.busy="1";c.dataset.via="fold";head.click()});
    body.append(f);
  }
  c.append(body);
  return c;
}

function enqueue(id,fn){
  const prev=queues[id]||Promise.resolve();
  const next=prev.then(fn,fn);
  queues[id]=next.catch(()=>{});
  return next;
}

async function setPart(id,key,val){
  if(!db)return;
  const before=orders[id]?.[key]??null;
  orders[id]={...orders[id],[key]:val};render();
  try{
    await enqueue(id,()=>db.doc("orders/"+id).update({[key]:val}));
    setStatus("Сохранено");
  }catch(e){
    orders[id]={...orders[id],[key]:before};render();
    handleErr(e);
  }
}


function handleErr(e){
  const code=e&&e.code;
  if(code==="invalid_argument"){canWrite=false;render();setStatus("У тебя нет прав на изменения — только просмотр")}
  else if(code==="quota_exceeded")setStatus("Хранилище заполнено, удали старые заказы");
  else setStatus("Не удалось сохранить, проверь связь и нажми ещё раз");
}

function canon(src){
  const out={};
  Object.keys(src||{}).sort((a,b)=>Number(a)-Number(b)).forEach(id=>{
    const o=src[id]||{},c={};
    Object.keys(o).sort().forEach(k=>{if(o[k]!==null&&o[k]!==undefined&&o[k]!=="")c[k]=o[k]});
    out[id]=c;
  });
  return out;
}
let bakedJSON=JSON.stringify(canon(SNAP.orders));
let artifactNS=null,publishing=false;
function buildDoc(snap){
  const json=JSON.stringify(snap).replace(/</g,"\\u003c");
  const style=document.getElementById("mainstyle").textContent;
  const close="</"+"script>";
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET_CSS+'</style></head><body>\n'
    +HEAD_HTML+'<style id="mainstyle">'+style+'</style>\n<div id="app"></div>\n'
    +'<script type="application/json" id="snapshot">'+json+close+'\n'
    +'<script id="main">'+SELF_JS+close+'\n</body></html>';
}
async function flushComments(){
  const ids=Object.keys(drafts);
  for(const id of ids){clearTimeout(commentTimers[id]);await saveComment(id)}
}
async function publishSnapshot(){
  if(!artifactNS||!db||publishing)return;
  await flushComments();
  const data=canon(orders);
  const j=JSON.stringify(data);
  if(j===bakedJSON)return;
  publishing=true;
  setStatus("Обновляю версию для просмотра…");
  try{await prefQueue}catch(_){}
  try{
    await artifactNS.publish(buildDoc({orders:data,at:new Date().toISOString()}));
    bakedJSON=j;
  }catch(e){
    const c=e&&e.code;
    if(["not_writer","not_granted","not_declared","capability_disabled","capability_removed","consent_required"].includes(c))artifactNS=null;
    if(c!=="conflict")setStatus("Версия для просмотра не обновилась");
  }finally{publishing=false}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")publishSnapshot()});

let markBackup=null;
function updateBulkUI(){
  const box=document.getElementById("bulkTools");if(!box)return;
  const w=!!db&&canWrite;
  ["markAll","restoreAll"].forEach(id=>{const b=document.getElementById(id);if(b)b.hidden=!w});
  document.getElementById("markAll").disabled=!!markBackup||!editable();
  document.getElementById("restoreAll").disabled=!markBackup||!editable();
}
async function markAll(){
  if(!db||markBackup||!editable())return;
  const ids=Object.keys(orders);
  const FIELDS=[...PARTS.map(p=>p[0]),"loc","kind","comment","babushkina"];
  const backup={};ids.forEach(id=>{backup[id]={};FIELDS.forEach(k=>{backup[id][k]=orders[id][k]??null})});
  // empty comments get filler text as long as the longest real comment; remember which ones to clear on restore
  const hasText=id=>typeof orders[id].comment==="string"&&orders[id].comment.trim()!=="";
  const maxLen=Math.max(0,...ids.filter(hasText).map(id=>orders[id].comment.length));
  const FILL="Тестовый текст комментария для проверки вида страницы. ";
  const filler=maxLen?FILL.repeat(Math.ceil(maxLen/FILL.length)).slice(0,maxLen).trim():"";
  const fillIds=new Set(filler?ids.filter(id=>!hasText(id)):[]);
  try{
    await db.doc("meta/markBackup").set({orders:backup,at:new Date().toISOString()});
    markBackup=backup;updateBulkUI();setStatus("Отмечаю все…");
    for(const id of ids){
      const patch={};PARTS.forEach(([k])=>{if(!orders[id][k])patch[k]="ok"});
      if(fillIds.has(id))patch.comment=filler;
      if(Object.keys(patch).length){orders[id]={...orders[id],...patch};await enqueue(id,()=>db.doc("orders/"+id).update(patch))}
    }
    render();setStatus("Всё отмечено");
  }catch(e){handleErr(e)}
}
async function restoreAll(){
  if(!db||!markBackup||!editable())return;
  try{
    setStatus("Возвращаю как было…");
    for(const id of Object.keys(markBackup)){
      if(!orders[id])continue;
      const patch={...markBackup[id]};
      clearTimeout(commentTimers[id]);delete drafts[id];
      orders[id]={...orders[id],...patch};
      await enqueue(id,()=>db.doc("orders/"+id).update(patch));
    }
    markBackup=null;render();updateBulkUI();setStatus("Вернул как было");
    // clear the stored backup; if delete is refused, overwrite it with an empty marker instead
    try{await db.doc("meta/markBackup").delete()}catch(_){try{await db.doc("meta/markBackup").set({orders:null,at:new Date().toISOString()})}catch(__){}}
  }catch(e){handleErr(e)}
}

let prefRef=null,prefQueue=Promise.resolve();
function savePrefs(){
  if(!prefRef)return;
  const body={locked,collapsed:[...collapsed]};
  prefQueue=prefQueue.then(()=>prefRef.set(body)).catch(()=>{});
}

const OFFLINE=false;
const SYNC_KIND="dyson-hs09-sync";
function syncMsg(t,err){const m=document.getElementById("syncMsg");if(!m)return;m.textContent=t||"";m.classList.toggle("err",!!err)}
function cleanOrders(src){
  // accept only known fields and values; anything else is dropped
  const out={};const PK=PARTS.map(p=>p[0]),SK=STATES.map(x=>x[0]),LK=LOCS.map(x=>x[0]),KK=KINDS.map(x=>x[0]);
  if(!src||typeof src!=="object")return null;
  for(const id of Object.keys(src)){
    if(!/^\d{3,8}$/.test(id))continue;
    const o=src[id];if(!o||typeof o!=="object")continue;
    const c={num:Number(id)};
    PK.forEach(k=>{if(SK.includes(o[k]))c[k]=o[k]});
    if(LK.includes(o.loc))c.loc=o.loc;
    if(KK.includes(o.kind))c.kind=o.kind;
    if(o.babushkina===true)c.babushkina=true;
    if(typeof o.comment==="string"&&o.comment)c.comment=o.comment.slice(0,2000);
    if(typeof o.crm==="string"&&CRM_RE.test(o.crm))c.crm=o.crm;
    out[id]=c;
  }
  return Object.keys(out).length?out:null;
}
async function copyForOffline(){
  const btn=document.getElementById("offCopy");
  try{
    await flushComments();
    const text=JSON.stringify({kind:SYNC_KIND,at:new Date().toISOString(),orders:canon(orders)});
    let ok=false;
    try{await navigator.clipboard.writeText(text);ok=true}catch(_){}
    if(!ok){
      const t=document.createElement("textarea");t.value=text;t.setAttribute("readonly","");t.style.cssText="position:fixed;top:0;left:0;opacity:0";
      document.body.append(t);t.select();try{ok=document.execCommand("copy")}catch(_){ok=false}t.remove();
    }
    if(btn){btn.classList.remove("done","fail");void btn.offsetWidth;btn.classList.add(ok?"done":"fail");btn.title=ok?"Скопировано — вставь на офлайн-странице":"Не удалось скопировать";clearTimeout(copyForOffline.t);copyForOffline.t=setTimeout(()=>{btn.classList.remove("done","fail");btn.title="Скопировать для офлайн"},1800)}
    if(!ok)syncMsg("Не удалось скопировать",true);
  }catch(e){syncMsg("Не удалось скопировать",true)}
  if(btn)btn.blur();
}
async function importForOffline(text){
  let data=null;
  try{data=JSON.parse(String(text||"").trim())}catch(_){}
  if(!data||data.kind!==SYNC_KIND){syncMsg("Это не те данные — скопируй их кнопкой на основной странице",true);return false}
  const clean=cleanOrders(data.orders);
  if(!clean){syncMsg("В скопированном нет заказов",true);return false}
  if(!artifactNS){syncMsg("Сохранение здесь недоступно",true);return false}
  const at=typeof data.at==="string"&&!isNaN(new Date(data.at))?data.at:new Date().toISOString();
  syncMsg("Сохраняю…");
  try{
    await artifactNS.publish(buildDoc({orders:clean,at}));
    syncMsg("Готово, страница обновляется…");
    return true;
  }catch(e){
    const c=e&&e.code;
    syncMsg(c==="not_writer"||c==="not_granted"?"У этого аккаунта нет права обновлять страницу":c==="conflict"?"Страница уже обновилась, попробуй ещё раз":"Не удалось сохранить",true);
    return false;
  }
}
document.getElementById("offCopy").addEventListener("click",copyForOffline);
document.getElementById("markAll").addEventListener("click",markAll);
document.getElementById("restoreAll").addEventListener("click",restoreAll);
// service panel show/hide (remembered per viewer)

let importBusy=false;

document.getElementById("offImport").addEventListener("click",()=>{

const ADMIN_UID="BD8l6QXbUThSwdUG83lD16cu2tx1";
let FBX=null,seeded=false;
async function fbInit(){
  const base="https://www.gstatic.com/firebasejs/"+FB_VER+"/";
  const [A,Au,F]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js"),import(base+"firebase-firestore.js")]);
  const app=A.initializeApp(FB_CFG);
  let fs;
  // keeps a local copy, so marks made without network are sent when it comes back
  try{fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}
  catch(_){fs=F.getFirestore(app)}
  const auth=Au.getAuth(app);
  try{await Au.getRedirectResult(auth)}catch(e){authFoot(null,"Вход не удался: "+(e&&e.code||""))}
  const u=await new Promise(r=>{const off=Au.onAuthStateChanged(auth,x=>{off();r(x)})});
  Au.onAuthStateChanged(auth,x=>{if((x&&x.uid)!==(u&&u.uid))location.reload()});
  const isAdmin=!!u&&u.uid===ADMIN_UID;
  authFoot(u,null,{auth,Au,isAdmin});
  // same shape the page already used: doc(path).get/set/update/delete, collection(name).onSnapshot
  const CODES={"permission-denied":"invalid_argument","resource-exhausted":"quota_exceeded"};
  const tr=e=>{const x=new Error(e&&e.message);x.code=CODES[e&&e.code]||(e&&e.code);throw x};
  const wrap=d=>({id:d.id,exists:d.exists(),data:()=>d.data()});
  const doc=p=>{const r=F.doc(fs,p);return{
    get:()=>F.getDoc(r).then(wrap,tr),
    set:b=>F.setDoc(r,b).catch(tr),
    update:b=>F.updateDoc(r,b).catch(tr),
    delete:()=>F.deleteDoc(r).catch(tr)}};
  const collection=n=>({onSnapshot:(cb,eb)=>F.onSnapshot(F.collection(fs,n),{includeMetadataChanges:true},
    q=>cb({docs:q.docs.map(wrap),empty:q.empty,fromCache:q.metadata.fromCache,metadata:{hasPendingWrites:q.metadata.hasPendingWrites}}),eb)});
  const seed=async src=>{const w=F.writeBatch(fs);for(const id of Object.keys(src)){if(/^\d{3,8}$/.test(id))w.set(F.doc(fs,"orders/"+id),src[id])}await w.commit().catch(tr)};
  return{db:{doc,collection},seed,user:{can:async()=>isAdmin,isOwner:async()=>isAdmin,id:async()=>u?u.uid:null}};
}
function authFoot(u,err,ctx){
  let el=document.getElementById("authFoot");
  if(!el){el=document.createElement("div");el.id="authFoot";el.className="authfoot";(document.querySelector(".wrap")||document.body).append(el)}
  if(err){let e=el.querySelector(".err");if(!e){e=document.createElement("div");e.className="err";el.prepend(e)}e.textContent=err;return}

    btn.textContent="Выйти";btn.onclick=()=>Au.signOut(auth);
    el.replaceChildren(t,btn);
  }else{
    btn.textContent="Вход для владельца";
    btn.onclick=async()=>{
      const p=new Au.GoogleAuthProvider();
      try{await Au.signInWithPopup(auth,p)}
      catch(e){
        const c=e&&e.code;

  }

  try{

  },err=>{setStatus("Связь с хранилищем потеряна, обнови страницу");});
