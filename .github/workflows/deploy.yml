# Publishes the site to Firebase Hosting (https://dyson-hs09.web.app) on every push to main.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT (service-account JSON from the Firebase console).
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    # pinned: "ubuntu-latest" moves to Ubuntu 26 from 2026-10-19
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Firebase Hosting
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -o pipefail
          if [ -z "$SA" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is empty or missing"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # pinned to 15.34.0: 15.34.1 (2026-10-21) asks Google for a permission our deploy key does not have
          # the CLI's own messages go to the log; on failure the last lines are also shown as annotations
          if ! npx --yes firebase-tools@15.34.0 deploy --only hosting --project dyson-hs09 --non-interactive 2>&1 | tee "$RUNNER_TEMP/deploy.log"; then
            grep -iE "error|denied|permission|expired|invalid|disabled|not found|unauth" "$RUNNER_TEMP/deploy.log" | tail -n 6 | while IFS= read -r l; do echo "::error::$l"; done
            tail -n 3 "$RUNNER_TEMP/deploy.log" | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
